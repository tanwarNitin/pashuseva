# Docker Compose configuration for PashuSeva development
# Provides PostgreSQL 16 with PostGIS 3.5 extension

services:
  postgres:
    # Use official PostGIS image with PostgreSQL 16 and PostGIS 3.5
    image: postgis/postgis:16-3.5
    container_name: pashuseva-postgres

    environment:
      # Database configuration
      # These values should match your .env.local DATABASE_URL
      POSTGRES_DB: ${POSTGRES_DB:-pashuseva}
      POSTGRES_USER: ${POSTGRES_USER:-pashuseva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}

      # PostgreSQL configuration
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      # Bind to localhost only for security
      - "127.0.0.1:5432:5432"

    volumes:
      # Persistent data storage
      - pashuseva-postgres-data:/var/lib/postgresql/data

      # Optional: custom initialization scripts
      # - ./sql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pashuseva} -d ${POSTGRES_DB:-pashuseva}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Test database (optional, for running integration tests)
  postgres-test:
    image: postgis/postgis:16-3.5
    container_name: pashuseva-postgres-test

    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-pashuseva_test}
      POSTGRES_USER: ${POSTGRES_USER:-pashuseva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - pashuseva-postgres-test-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pashuseva} -d ${POSTGRES_TEST_DB:-pashuseva_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    profiles:
      # Only start when explicitly requested
      - test

volumes:
  pashuseva-postgres-data:
    name: pashuseva-postgres-data

  pashuseva-postgres-test-data:
    name: pashuseva-postgres-test-data
